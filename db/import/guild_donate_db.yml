###########################################################################
# Guild Donate Bonus Settings
###########################################################################
# Level: Consecutive tier number from 1. The loaded DB determines the tier count.
# RequiredZeny: Positive CUMULATIVE guild donation total, strictly increasing.
# Icon: Supported EFST_* value; EFST_BLANK disables the icon.
# Every valid tier is active automatically.
# Script: Complete passive bonus for this tier; only the highest unlocked tier runs.
# Example: Level: 1 / RequiredZeny: 100000 / Script: bonus bAllStats,1;
# Add/remove Level rows to change the cap; no NPC setarray is required.
# Reload: @reloadpcdb updates thresholds, SQL levels, online bonuses and icons.
# Existing total_zeny and donation logs are preserved when tiers change.
###########################################################################
Header:
  Type: GUILD_DONATE_DB
  Version: 2

Body:
  - Level: 1
    RequiredZeny: 100000
    Icon: EFST_BLANK
    Script: |
      bonus bAllStats,1;
  - Level: 2
    RequiredZeny: 200000
    Icon: EFST_BLANK
    Script: |
      bonus bAllStats,2;
  - Level: 3
    RequiredZeny: 300000
    Icon: EFST_BLANK
    Script: |
      bonus bAllStats,5;
  - Level: 4
    RequiredZeny: 400000
    Icon: EFST_BLANK
    Script: |
      bonus bAllStats,10;
  - Level: 5
    RequiredZeny: 500000
    Icon: EFST_BLANK
    Script: |
      bonus bAllStats,15;