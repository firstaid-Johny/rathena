###########################################################################
# Guild Donate Bonus Settings
###########################################################################
# Level: Position in the NPC Required array (first entry = level 1).
# Enabled: Set true after choosing the real bonus. Examples are disabled.
# Icon: Use an unused supported EFST_* value, or EFST_BLANK for no icon.
# Script: Only the current highest tier runs. Set the complete bonus for that tier.
# Example: Enabled: true / Icon: EFST_BLANK / Script: bonus bAllStats,1;
# Reload: @reloadpcdb
###########################################################################
